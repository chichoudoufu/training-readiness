<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0d0f14;
  --bg2: #151820;
  --bg3: #1c2030;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8eaf0;
  --text2: #8890a4;
  --text3: #4a5168;
  --accent: #5b8df6;
  --accent2: #3d6fe8;
  --green: #3ecf8e;
  --red: #f06060;
  --amber: #f0a940;
  --teal: #2ec4b6;
  --r: 10px;
  --r2: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Sora', sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }

/* ── LAYOUT ── */
.app { display: flex; flex-direction: column; min-height: 100vh; }
header { padding: 18px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: rgba(13,15,20,0.92); backdrop-filter: blur(12px); z-index: 100; }
.logo { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
.header-right { display: flex; align-items: center; gap: 12px; }
main { flex: 1; padding: 28px; max-width: 1100px; margin: 0 auto; width: 100%; }

/* ── CONNECT SCREEN ── */
#screen-connect { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 65px); }
.connect-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; }
.connect-icon { font-size: 40px; margin-bottom: 20px; }
.connect-card h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.connect-card p { color: var(--text2); margin-bottom: 32px; font-size: 13px; }
.connect-btns { display: flex; flex-direction: column; gap: 12px; }
.btn-strava { background: #FC4C02; color: #fff; border: none; border-radius: var(--r2); padding: 13px 20px; font-family: 'Sora',sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.15s; }
.btn-strava:hover { opacity: 0.88; }
.btn-strava svg { width: 20px; height: 20px; }
.divider-or { display: flex; align-items: center; gap: 12px; color: var(--text3); font-size: 12px; }
.divider-or::before, .divider-or::after { content:''; flex:1; height:1px; background:var(--border); }
.btn-upload { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); border-radius: var(--r2); padding: 13px 20px; font-family:'Sora',sans-serif; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.15s; }
.btn-upload:hover { background: #232738; }
.btn-upload input { display: none; }
.note-strava { font-size: 11px; color: var(--text3); margin-top: 16px; }
.note-strava a { color: var(--accent); text-decoration: none; }

/* ── STRAVA CONFIG ── */
#screen-strava-config { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 65px); }
.config-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; padding: 40px; max-width: 480px; width: 100%; }
.config-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.config-card .sub { color: var(--text2); font-size: 12px; margin-bottom: 24px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.field input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--r2); padding: 10px 12px; color: var(--text); font-family:'DM Mono',monospace; font-size: 13px; outline: none; }
.field input:focus { border-color: var(--accent); }
.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--r2); padding: 12px; font-family:'Sora',sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
.btn-primary:hover { background: var(--accent2); }
.btn-back { background: none; border: none; color: var(--text2); font-family:'Sora',sans-serif; font-size: 13px; cursor: pointer; margin-top: 12px; width: 100%; }
.btn-back:hover { color: var(--text); }

/* ── OAUTH CALLBACK ── */
#screen-oauth { display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 65px); }
.oauth-box { text-align:center; }
.spinner { width:36px; height:36px; border:3px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── DASHBOARD ── */
#screen-dashboard { display: none; }
.status-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.status-bar h2 { font-size: 18px; font-weight: 600; }
.data-source { font-size: 11px; color: var(--text3); background: var(--bg3); border: 1px solid var(--border); border-radius: 99px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
.data-source .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* cards */
.kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
.kpi-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.kpi-value { font-size: 26px; font-weight: 600; font-family: 'DM Mono', monospace; letter-spacing: -0.02em; }
.kpi-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }
.kpi-value.good { color: var(--green); }
.kpi-value.warn { color: var(--amber); }
.kpi-value.bad  { color: var(--red); }

/* advice */
.advice-box { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 18px 20px; margin-bottom: 24px; }
.advice-title { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.advice-loading { color: var(--text2); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.advice-text { font-size: 13px; color: var(--text2); line-height: 1.75; }
.advice-text strong { color: var(--text); font-weight: 500; }

/* tabs + charts */
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 20px; }
.panel-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }
.tab-row { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.tab { padding: 5px 14px; border-radius: 99px; font-size: 12px; border: 1px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-family:'Sora',sans-serif; transition: all 0.15s; }
.tab.active { background: var(--accent); color: #fff; border-color: transparent; }
.chart-wrap { position: relative; width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; }
.legend span { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink:0; }
.legend-line { width: 14px; height: 2px; flex-shrink:0; }
.section-note { font-size: 11px; color: var(--text3); margin-top: 8px; }
hr.divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

.btn-disconnect { background: none; border: 1px solid var(--border2); color: var(--text2); border-radius: var(--r2); padding: 6px 12px; font-family:'Sora',sans-serif; font-size: 12px; cursor: pointer; }
.btn-disconnect:hover { border-color: var(--red); color: var(--red); }

@media (max-width: 700px) {
  .kpi-grid { grid-template-columns: repeat(2,1fr); }
  main { padding: 16px; }
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo"><span class="logo-dot"></span>Training Analytics</div>
  <div class="header-right" id="header-right"></div>
</header>

<!-- CONNECT -->
<div id="screen-connect">
  <div class="connect-card">
    <div class="connect-icon">📊</div>
    <h1>トレーニング分析</h1>
    <p>StravaまたはGarminのデータを接続して<br>PMC・VO2max・FTPの推移を分析します</p>
    <div class="connect-btns">
      <button class="btn-strava" onclick="startStravaAuth()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0 2 12.872h4.168"/></svg>
        Stravaで接続
      </button>
      <div class="divider-or">または</div>
      <label class="btn-upload">
        <input type="file" accept=".csv" id="file-input" onchange="handleFileUpload(event)">
        📁 GarminのCSVファイルを読み込む
      </label>
    </div>
  </div>
</div>

<!-- OAUTH PROCESSING -->
<div id="screen-oauth" style="display:none">
  <div class="oauth-box">
    <div class="spinner"></div>
    <p style="color:var(--text2)">Stravaと接続中...</p>
  </div>
</div>

<!-- DASHBOARD -->
<main id="screen-dashboard" style="display:none">
  <div class="status-bar">
    <h2 id="dash-title">トレーニング分析</h2>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="data-source"><span class="dot"></span><span id="source-label">-</span></div>
      <button class="btn-disconnect" onclick="disconnect()">切断</button>
    </div>
  </div>

  <div class="kpi-grid" id="kpi-grid"></div>

  <div class="advice-box">
    <div class="advice-title">🤖 AI コーチアドバイス</div>
    <div id="advice-content"><div class="advice-loading"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div>分析中...</div></div>
  </div>

  <div class="panel">
    <div class="tab-row" id="chart-tabs"></div>
    <div id="chart-area"></div>
  </div>
</main>
</div>

<script>
// ─────────────────────────────────────────────
// SCREEN ROUTING
// ─────────────────────────────────────────────
const screens = ['connect','oauth','dashboard'];
function showScreen(name) {
  screens.forEach(s => {
    const el = document.getElementById('screen-' + s);
    if (el) el.style.display = s === name ? (s === 'dashboard' ? 'block' : 'flex') : 'none';
  });
}
// ─────────────────────────────────────────────
// STRAVA OAUTH (via Netlify Function)
// ─────────────────────────────────────────────
const STRAVA_CLIENT_ID = '244519';
const REDIRECT_URI = 'https://tiny-crepe-fb6027.netlify.app';

async function startStravaAuth() {
  const params = new URLSearchParams({
    client_id: STRAVA_CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'code',
    scope: 'read,activity:read_all',
    approval_prompt: 'force'
  });
  window.location.href = 'https://www.strava.com/oauth/authorize?' + params.toString();
}

async function handleOAuthCallback(code) {
  showScreen('oauth');
  try {
    const res = await fetch('/.netlify/functions/strava-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, grant_type: 'authorization_code' })
    });
    const data = await res.json();
    if (data.access_token) {
      localStorage.setItem('strava_token', data.access_token);
      localStorage.setItem('strava_refresh_token', data.refresh_token || '');
      localStorage.setItem('strava_token_expiry', data.expires_at || 0);
      localStorage.setItem('strava_athlete', JSON.stringify(data.athlete));
      window.history.replaceState({}, '', window.location.pathname);
      await loadStravaData(data.access_token);
    } else {
      alert('認証失敗: ' + (data.message || JSON.stringify(data)));
      showScreen('connect');
    }
  } catch(e) {
    alert('接続エラー: ' + e.message);
    showScreen('connect');
  }
}

async function getValidToken() {
  const token = localStorage.getItem('strava_token');
  const expiry = parseInt(localStorage.getItem('strava_token_expiry') || '0');
  const refresh = localStorage.getItem('strava_refresh_token');
  if (Date.now() / 1000 < expiry - 300) return token;
  if (!refresh) return null;
  try {
    const res = await fetch('/.netlify/functions/strava-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ grant_type: 'refresh_token', refresh_token: refresh })
    });
    const data = await res.json();
    if (data.access_token) {
      localStorage.setItem('strava_token', data.access_token);
      localStorage.setItem('strava_token_expiry', data.expires_at || 0);
      localStorage.setItem('strava_refresh_token', data.refresh_token || refresh);
      return data.access_token;
    }
    // リフレッシュ失敗時はトークンをクリア
    localStorage.removeItem('strava_token');
    localStorage.removeItem('strava_refresh_token');
    localStorage.removeItem('strava_token_expiry');
  } catch(e) {}
  return null;
}

async function loadStravaData(token) {
  showScreen('oauth');
  const validToken = token || await getValidToken();
  if (!validToken) { showScreen('connect'); return; }
  const days = 120;
  const after = Math.floor((Date.now() / 1000) - days * 86400);
  let activities = [];
  let page = 1;
  try {
    while (true) {
      const res = await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=100&page=${page}`, {
        headers: { 'Authorization': 'Bearer ' + validToken }
      });
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('strava_token');
          localStorage.removeItem('strava_refresh_token');
          localStorage.removeItem('strava_token_expiry');
          showScreen('connect');
          return;
        }
        break;
      }
      const batch = await res.json();
      if (!Array.isArray(batch) || batch.length === 0) break;
      activities = activities.concat(batch);
      if (batch.length < 100) break;
      page++;
    }
  } catch(e) {
    console.error('Strava fetch error:', e);
  }
  const normalized = activities.map(a => ({
    type: stravaTypeToJa(a.type),
    date: a.start_date_local.slice(0, 10),
    dist: a.distance / 1000,
    time: a.moving_time / 60,
    avgHR: a.average_heartrate || null,
    maxHR: a.max_heartrate || null,
    np: a.weighted_average_watts || null,
    avgPow: a.average_watts || null,
    tss: 0,
    p20: null,
    name: a.name
  }));
  const athlete = JSON.parse(localStorage.getItem('strava_athlete') || '{}');
  renderDashboard(normalized, 'Strava: ' + (athlete.firstname || '') + ' ' + (athlete.lastname || '').trim());
}

function stravaTypeToJa(t) {
  const map = { Run:'ラン', VirtualRun:'ラン', TrailRun:'ラン', Treadmill:'トレッドミル', Ride:'ロードサイクリング', VirtualRide:'仮想サイクリング', Swim:'プールスイム', Walk:'ウォーク', Workout:'筋力トレーニング', WeightTraining:'筋力トレーニング' };
  return map[t] || t;
}

// ─────────────────────────────────────────────
// GARMIN CSV
// ─────────────────────────────────────────────
function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const activities = parseGarminCSV(text);
    if (activities.length === 0) { alert('アクティビティが見つかりませんでした'); return; }
    renderDashboard(activities, 'Garmin CSV: ' + file.name);
  };
  reader.readAsText(file, 'UTF-8');
}

function parseGarminCSV(text) {
  const lines = text.trim().split('\n');
  const header = lines[0].split(',').map(h => h.replace(/"/g,'').trim());
  const idx = h => header.indexOf(h);
  const activities = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = smartSplit(lines[i]);
    const get = h => (cols[idx(h)] || '').replace(/"/g,'').trim();
    const timeStr = get('タイム');
    const timeMin = parseTime(timeStr);
    const dist = parseFloat(get('距離')) || 0;
    const tssRaw = parseFloat(get('Training Stress Score®')) || 0;
    const np = parseFloat(get('Normalized Power® (NP®)')) || null;
    const p20 = parseFloat(get('最大平均パワー（20 分）')) || null;
    activities.push({
      type: get('アクティビティタイプ'),
      date: (get('日付') || '').slice(0, 10),
      dist: dist,
      time: timeMin,
      avgHR: parseInt(get('平均心拍数')) || null,
      maxHR: parseInt(get('最大心拍数')) || null,
      np: np || (parseFloat(get('平均パワー')) || null),
      tss: tssRaw,
      p20: p20,
      name: get('タイトル')
    });
  }
  return activities.filter(a => a.date && a.time > 0);
}

function smartSplit(line) {
  const res = []; let cur = ''; let inQ = false;
  for (const c of line) {
    if (c === '"') { inQ = !inQ; cur += c; }
    else if (c === ',' && !inQ) { res.push(cur); cur = ''; }
    else cur += c;
  }
  res.push(cur);
  return res;
}

function parseTime(s) {
  if (!s || s === '--') return 0;
  const p = s.split(':').map(parseFloat);
  if (p.length === 3) return p[0]*60 + p[1] + p[2]/60;
  if (p.length === 2) return p[0] + p[1]/60;
  return 0;
}

// ─────────────────────────────────────────────
// ANALYTICS ENGINE
// ─────────────────────────────────────────────
const LTHR = 167, rFTP = 280, FTP_BIKE = 162;

function estimateTSS(a) {
  if (a.tss > 0) return a.tss;
  const h = a.time / 60;
  if (h <= 0) return 0;
  if (a.np && (a.type.includes('ラン') || a.type.includes('トレッドミル'))) {
    const IF = a.np / rFTP; return Math.round(IF*IF*h*100);
  }
  if (a.type.includes('バイク') || a.type.includes('サイクリング')) {
    if (a.np) { const IF = a.np/FTP_BIKE; return Math.round(IF*IF*h*100); }
    if (a.avgHR) { const IF = a.avgHR/LTHR; return Math.round(IF*IF*h*100*0.67); }
  }
  if (a.type.includes('スイム')) return Math.round(h*60*2.5);
  if (a.type.includes('ウォーク')) {
    if (!a.avgHR) return 0;
    const IF = a.avgHR/LTHR; return Math.round(IF*IF*h*100*0.4);
  }
  if (a.avgHR) { const IF = a.avgHR/LTHR; return Math.round(IF*IF*h*100*0.6); }
  return 0;
}

function estimateVO2(a) {
  if (!a.np || !a.time || a.dist <= 0) return null;
  const s = (a.dist*1000)/(a.time*60);
  if (s < 1.5 || a.type.includes('バイク') || a.type.includes('ウォーク')) return null;
  return +Math.min(Math.max((a.np/3.5)*0.85+s*3.5, 40), 65).toFixed(1);
}

function buildTimeSeries(activities, startDate, endDate) {
  // 今日まで含むよう期間を拡張
  const today = new Date();
  today.setHours(12,0,0,0); // 正午に固定してタイムゾーン問題を回避
  const todayStr = today.toISOString().slice(0,10);
  const allStart = (startDate < endDate ? startDate : endDate) || todayStr;

  // 全日付リスト（最古〜今日）
  const allDates = [];
  const da = new Date(allStart + 'T12:00:00');
  const de = new Date(todayStr + 'T12:00:00');
  while (da <= de) {
    allDates.push(da.toISOString().slice(0,10));
    da.setDate(da.getDate()+1);
  }

  const dayMap = {};
  activities.forEach(a => {
    if (!dayMap[a.date]) dayMap[a.date] = {run:0,bike:0,other:0,vo2:null,ftp:null};
    const t = estimateTSS(a);
    if (a.type.includes('ラン')||a.type.includes('トレッドミル')) dayMap[a.date].run += t;
    else if (a.type.includes('バイク')||a.type.includes('サイクリング')) dayMap[a.date].bike += t;
    else dayMap[a.date].other += t;
    const v = estimateVO2(a);
    if (v && (!dayMap[a.date].vo2 || v > dayMap[a.date].vo2)) dayMap[a.date].vo2 = v;
    if (a.p20) {
      const f = +(a.p20*0.95).toFixed(0);
      if (!dayMap[a.date].ftp || f > dayMap[a.date].ftp) dayMap[a.date].ftp = f;
    } else if (a.np && (a.type.includes('バイク')||a.type.includes('サイクリング'))) {
      const f = +(a.np*0.88).toFixed(0);
      if (!dayMap[a.date].ftp || f > dayMap[a.date].ftp) dayMap[a.date].ftp = f;
    }
  });

  // 全期間でCTL/ATLを積み上げ（初期値は0から自然収束させる）
  const ctl=[], atl=[], tsb=[], run=[], bike=[], other=[], vo2=[], ftp=[];
  const dates = allDates; // 表示用は全期間
  let ctlV=0, atlV=0;
  dates.forEach(d => {
    const dt = dayMap[d] || {run:0,bike:0,other:0,vo2:null,ftp:null};
    const tot = dt.run+dt.bike+dt.other;
    ctlV = ctlV+(tot-ctlV)/42;
    atlV = atlV+(tot-atlV)/7;
    ctl.push(+ctlV.toFixed(1));
    atl.push(+atlV.toFixed(1));
    tsb.push(+(ctlV-atlV).toFixed(1));
    run.push(dt.run); bike.push(dt.bike); other.push(dt.other);
    vo2.push(dt.vo2); ftp.push(dt.ftp);
  });

  // smoothed vo2
  const vo2MA = vo2.map((v,i) => {
    const w = vo2.slice(Math.max(0,i-6),i+1).filter(x=>x!==null);
    return w.length ? +(w.reduce((a,b)=>a+b,0)/w.length).toFixed(1) : null;
  });

  return { dates, labels: dates.map(d=>d.slice(5)), ctl, atl, tsb, run, bike, other, vo2, vo2MA, ftp };
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
let charts = {};
function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  charts = {};
}

function renderDashboard(activities, sourceLabel) {
  destroyCharts();
  showScreen('dashboard');
  document.getElementById('source-label').textContent = sourceLabel;

  // Decompose multisport into swim/bike/run by race type
  function decomposeMultisport(a) {
    const h = a.time / 60;
    var sf, bf, rf, st, bt, rt;
    if (h >= 8) {
      // Full Ironman
      sf=0.107; bf=0.560; rf=0.333;
      st=60; bt=65; rt=70;
    } else if (h >= 3.5) {
      // Half Ironman
      sf=0.13; bf=0.55; rf=0.32;
      st=62; bt=72; rt=75;
    } else if (h >= 1.5) {
      // Olympic
      sf=0.17; bf=0.50; rf=0.33;
      st=65; bt=78; rt=80;
    } else {
      // Sprint
      sf=0.18; bf=0.48; rf=0.34;
      st=65; bt=82; rt=85;
    }
    return [
      Object.assign({}, a, {type:'プールスイム', time:h*sf*60, dist:0,         tss:Math.round(h*sf*st)}),
      Object.assign({}, a, {type:'ロードサイクリング', time:h*bf*60, dist:a.dist*bf, tss:Math.round(h*bf*bt), np:null}),
      Object.assign({}, a, {type:'ラン', time:h*rf*60, dist:a.dist*rf, tss:Math.round(h*rf*rt), np:null}),
    ];
  }

  const expanded = [];
  activities.forEach(function(a) {
    var isMulti = a.type.includes('マルチスポーツ') ||
                  a.type.includes('Multisport') ||
                  a.type.includes('トライアスロン');
    if (isMulti) {
      decomposeMultisport(a).forEach(function(x){ expanded.push(x); });
    } else {
      expanded.push(a);
    }
  });

  const sorted = [...expanded].sort((a,b) => a.date.localeCompare(b.date));
  const startDate = sorted[0]?.date || new Date().toISOString().slice(0,10);
  const endDate = sorted[sorted.length-1]?.date || new Date().toISOString().slice(0,10);
  const ts = buildTimeSeries(sorted, startDate, endDate);

  const curCTL = ts.ctl[ts.ctl.length-1];
  const curATL = ts.atl[ts.atl.length-1];
  const curTSB = ts.tsb[ts.tsb.length-1];
  const curVO2 = ts.vo2MA.filter(x=>x!==null).pop() || null;
  const ftpVals = ts.ftp.filter(x=>x!==null);
  const curFTP = ftpVals.length ? Math.max(...ftpVals) : null;

  // KPI cards
  const tsbColor = curTSB > 5 ? 'good' : curTSB > -10 ? '' : 'bad';
  const tsbLabel = curTSB > 5 ? 'レース準備OK' : curTSB > -10 ? '通常トレーニング' : '疲労蓄積中';
  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi"><div class="kpi-label">CTL フィットネス</div><div class="kpi-value">${curCTL.toFixed(0)}</div><div class="kpi-sub">42日平均TSS</div></div>
    <div class="kpi"><div class="kpi-label">ATL 疲労</div><div class="kpi-value warn">${curATL.toFixed(0)}</div><div class="kpi-sub">7日平均TSS</div></div>
    <div class="kpi"><div class="kpi-label">TSB フォーム</div><div class="kpi-value ${tsbColor}">${curTSB>0?'+':''}${curTSB.toFixed(0)}</div><div class="kpi-sub">${tsbLabel}</div></div>
    <div class="kpi"><div class="kpi-label">FTP 推定</div><div class="kpi-value">${curFTP ? curFTP+'W' : '--'}</div><div class="kpi-sub">20分NP × 0.95</div></div>
    <div class="kpi"><div class="kpi-label">VO2max 推定</div><div class="kpi-value">${curVO2 ? curVO2 : '--'}</div><div class="kpi-sub">${curVO2 ? 'mL/kg/min' : '計測データ不足'}</div></div>
  `;

  // Advice
  generateAdvice({ curCTL, curATL, curTSB, curVO2, curFTP, activities: sorted });

  // Charts
  buildChartUI(ts);
}

// ─────────────────────────────────────────────
// ADVICE via Claude API
// ─────────────────────────────────────────────
async function generateAdvice({ curCTL, curATL, curTSB, curVO2, curFTP, activities }) {
  const el = document.getElementById('advice-content');
  el.innerHTML = '<div class="advice-loading"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div>AIが分析中...</div>';

  const recentActs = activities.slice(-14).map(a =>
    `${a.date} ${a.type} ${a.dist.toFixed(1)}km ${a.time.toFixed(0)}分 HR:${a.avgHR||'--'}`
  ).join('\n');

  const prompt = `あなたはトライアスロン・ランニングコーチです。以下のトレーニングデータを分析して、日本語で簡潔にアドバイスしてください。

現在のステータス:
- CTL（フィットネス）: ${curCTL.toFixed(1)}
- ATL（疲労）: ${curATL.toFixed(1)}  
- TSB（フォーム）: ${curTSB.toFixed(1)}
- FTP推定: ${curFTP ? curFTP+'W' : '不明'}
- VO2max推定: ${curVO2 ? curVO2+' mL/kg/min' : '不明'}

直近2週間のアクティビティ:
${recentActs}

以下の3点について、それぞれ2〜3文で具体的にアドバイスしてください:
1. **現在のコンディション評価**: TSB・CTL・ATLから見た状態
2. **今週の推奨トレーニング**: 強度・量・種目のバランス
3. **今後2〜3週間の方針**: ピーキング・ベース構築・回復など

HTMLタグは使わず、マークダウン（**太字**）のみ使用してください。`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || 'アドバイスを取得できませんでした';
    el.innerHTML = '<div class="advice-text">' + markdownToHtml(text) + '</div>';
  } catch(e) {
    el.innerHTML = `<div class="advice-text">
      <strong>現在のコンディション評価</strong><br>
      CTL ${curCTL.toFixed(0)} / ATL ${curATL.toFixed(0)} / TSB ${curTSB>0?'+':''}${curTSB.toFixed(0)}。
      ${curTSB < -10 ? '疲労が蓄積しています。回復を優先しましょう。' : curTSB > 5 ? 'フォームが良好です。レースや強度練習に適しています。' : '通常のトレーニング継続が可能です。'}
      <br><br>
      <strong>今週の推奨</strong><br>
      ${curATL > curCTL * 1.3 ? 'ATLがCTLを大きく上回っています。軽めのリカバリーランと休息を優先してください。' : 'ベーストレーニングを継続しながら週1回の質的練習を入れましょう。'}
    </div>`;
  }
}

function markdownToHtml(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>')
    .replace(/^\d+\.\s/gm, '');
}

const CHART_TABS = [
  { id: 'pmc', label: 'PMC' },
  { id: 'tss', label: 'デイリーTSS' },
  { id: 'vo2', label: 'VO2max推定' },
  { id: 'ftp', label: 'FTP推定' },
  { id: 'hr',  label: '心拍' },
];
let currentTab = 'pmc';
let currentTS = null;

function buildChartUI(ts) {
  currentTS = ts;
  const tabRow = document.getElementById('chart-tabs');
  tabRow.innerHTML = CHART_TABS.map(t =>
    `<button class="tab ${t.id===currentTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
  renderChart(currentTab);
}

function switchTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', CHART_TABS[i].id===id));
  renderChart(id);
}

        plugins:{legend:{display:false}},
        scales:{
          x:{ticks:{color:'#4a5168',font:{size:10},maxTicksLimit:12},grid:{color:gc}},
          yL:{position:'left',title:{display:true,text:'CTL / ATL',color:'#4a5168',font:{size:10}},min:0,max:pmcMax,ticks:{color:'#4a5168'},grid:{color:gc}},
          yR:{position:'right',title:{display:true,text:'TSB',color:'#4a5168',font:{size:10}},min:tsbMin,max:tsbMax,ticks:{color:'#4a5168'},grid:{drawOnChartArea:false}},
        }
      }
    });
    charts.c1b = new Chart(document.getElementById('c1b'), {
      type:'bar',
      data:{labels:ts.labels,datasets:[
        {label:'ラン',  data:ts.run,  backgroundColor:'rgba(91,141,246,0.7)',stack:'s',borderRadius:2},
        {label:'バイク',data:ts.bike, backgroundColor:'rgba(240,96,96,0.7)',stack:'s',borderRadius:2},
        {label:'その他',data:ts.other,backgroundColor:'rgba(62,207,142,0.7)',stack:'s',borderRadius:2},
      ]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:false}},
        scales:{
          x:{stacked:true,ticks:{color:'#4a5168',font:{size:10},maxTicksLimit:12},grid:{color:gc}},
          y:{stacked:true,min:0,max:tssMax,title:{display:true,text:'TSS',color:'#4a5168',font:{size:10}},ticks:{color:'#4a5168'},grid:{color:gc}},
        }
      }
    });
  }

  else if (id === 'tss') {
    const tssTot = ts.run.map((_,i)=>ts.run[i]+ts.bike[i]+ts.other[i]);
    const tssMax = Math.ceil(Math.max(...tssTot)/50)*50+50;
    area.innerHTML = `
      <div class="legend">
        <span><span class="legend-dot" style="background:#5b8df6"></span>ラン</span>
        <span><span class="legend-dot" style="background:#f06060"></span>バイク</span>
        <span><span class="legend-dot" style="background:#3ecf8e"></span>スイム/その他</span>
      </div>
      <div class="chart-wrap" style="height:260px"><canvas id="c2" role="img" aria-label="デイリーTSS"></canvas></div>
      <p class="section-note">※ GarminのTSSが0のアクティビティは心拍・時間から推計</p>`;

      <div class="legend">

      </div>
      <div class="chart-wrap" style="height:260px"><canvas id="c4" role="img" aria-label="FTP推定値"></canvas></div>`;
    charts.c4 = new Chart(document.getElementById('c4'), {
      type:'line',
      data:{labels:ts.labels,datasets:[
        {label:'FTP',data:ts.ftp,borderColor:'#f0a940',backgroundColor:'rgba(240,169,64,0.1)',tension:0.3,fill:true,pointRadius:5,spanGaps:true,borderWidth:2},

  else if (id === 'hr') {

    if (acts.length === 0) { area.innerHTML = '<p style="color:var(--text2);font-size:13px">心拍データがありません</p>'; return; }
    const hrLabels = acts.map(a=>a.date.slice(5)+' '+a.type.slice(0,3));
    const hrData = acts.map(a=>a.avgHR);
    const hrColors = acts.map(a => a.avgHR > 140 ? 'rgba(240,96,96,0.8)' : a.avgHR > 125 ? 'rgba(240,169,64,0.8)' : 'rgba(91,141,246,0.8)');
    const hWrap = Math.max(300, acts.length * 28 + 80);

}

// Store raw for HR chart
const _origRender = renderDashboard;
window.renderDashboard = function(activities, sourceLabel) {
  currentTS = null;
  _origRender(activities, sourceLabel);
  if (currentTS) currentTS._rawActivities = activities;
};

// DISCONNECT
// ─────────────────────────────────────────────
function disconnect() {
  localStorage.removeItem('strava_token');
  localStorage.removeItem('strava_athlete');
  destroyCharts();
  showScreen('connect');
}

// ─────────────────────────────────────────────
// INIT — check OAuth callback or saved token
// ─────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const savedToken = localStorage.getItem('strava_token');

  if (code) {
    await handleOAuthCallback(code);
  } else if (savedToken) {
    await loadStravaData(null);
  } else {
    showScreen('connect');
  }
});
