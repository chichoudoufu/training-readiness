<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0d0f14;
  --bg2: #151820;
  --bg3: #1c2030;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8eaf0;
  --text2: #8890a4;
  --text3: #4a5168;
  --accent: #5b8df6;
  --accent2: #3d6fe8;
  --green: #3ecf8e;
  --red: #f06060;
  --amber: #f0a940;
  --teal: #2ec4b6;
  --r: 10px;
  --r2: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Sora', sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }

/* ── LAYOUT ── */
.app { display: flex; flex-direction: column; min-height: 100vh; }
header { padding: 18px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: rgba(13,15,20,0.92); backdrop-filter: blur(12px); z-index: 100; }
.logo { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
.header-right { display: flex; align-items: center; gap: 12px; }
main { flex: 1; padding: 28px; max-width: 1100px; margin: 0 auto; width: 100%; }

/* ── CONNECT SCREEN ── */
#screen-connect { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 65px); }
.connect-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; }
.connect-icon { font-size: 40px; margin-bottom: 20px; }
.connect-card h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.connect-card p { color: var(--text2); margin-bottom: 32px; font-size: 13px; }
.connect-btns { display: flex; flex-direction: column; gap: 12px; }
.btn-strava { background: #FC4C02; color: #fff; border: none; border-radius: var(--r2); padding: 13px 20px; font-family: 'Sora',sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.15s; }
.btn-strava:hover { opacity: 0.88; }
.btn-strava svg { width: 20px; height: 20px; }
.divider-or { display: flex; align-items: center; gap: 12px; color: var(--text3); font-size: 12px; }
.divider-or::before, .divider-or::after { content:''; flex:1; height:1px; background:var(--border); }
.btn-upload { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); border-radius: var(--r2); padding: 13px 20px; font-family:'Sora',sans-serif; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.15s; }
.btn-upload:hover { background: #232738; }
.btn-upload input { display: none; }
.note-strava { font-size: 11px; color: var(--text3); margin-top: 16px; }
.note-strava a { color: var(--accent); text-decoration: none; }

/* ── STRAVA CONFIG ── */
#screen-strava-config { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 65px); }
.config-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; padding: 40px; max-width: 480px; width: 100%; }
.config-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.config-card .sub { color: var(--text2); font-size: 12px; margin-bottom: 24px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.field input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--r2); padding: 10px 12px; color: var(--text); font-family:'DM Mono',monospace; font-size: 13px; outline: none; }
.field input:focus { border-color: var(--accent); }
.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--r2); padding: 12px; font-family:'Sora',sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
.btn-primary:hover { background: var(--accent2); }
.btn-back { background: none; border: none; color: var(--text2); font-family:'Sora',sans-serif; font-size: 13px; cursor: pointer; margin-top: 12px; width: 100%; }
.btn-back:hover { color: var(--text); }

/* ── OAUTH CALLBACK ── */
#screen-oauth { display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 65px); }
.oauth-box { text-align:center; }
.spinner { width:36px; height:36px; border:3px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── DASHBOARD ── */
#screen-dashboard { display: none; }
.status-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.status-bar h2 { font-size: 18px; font-weight: 600; }
.data-source { font-size: 11px; color: var(--text3); background: var(--bg3); border: 1px solid var(--border); border-radius: 99px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
.data-source .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* cards */
.kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
.kpi-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.kpi-value { font-size: 26px; font-weight: 600; font-family: 'DM Mono', monospace; letter-spacing: -0.02em; }
.kpi-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }
.kpi-value.good { color: var(--green); }
.kpi-value.warn { color: var(--amber); }
.kpi-value.bad  { color: var(--red); }

/* advice */
.advice-box { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 18px 20px; margin-bottom: 24px; }
.advice-title { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.advice-loading { color: var(--text2); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.advice-text { font-size: 13px; color: var(--text2); line-height: 1.75; }
.advice-text strong { color: var(--text); font-weight: 500; }

/* tabs + charts */
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 20px; }
.panel-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }
.tab-row { display: flex; gap: 6px; margin-bottom
