name: Fetch Garmin Data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install garminconnect
        run: pip install garminconnect --break-system-packages

      - name: Fetch activities
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python3 fetch_garmin.py

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add activities.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update Garmin activities $(date +%Y-%m-%d)" && git push)
