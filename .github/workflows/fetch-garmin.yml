name: Fetch Garmin Data

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install garminconnect
        run: pip install garminconnect --break-system-packages

      - name: Fetch activities
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python3 << 'PYTHON'
import json, os, sys
from datetime import datetime, timedelta
from garminconnect import Garmin

email = os.environ['GARMIN_EMAIL']
password = os.environ['GARMIN_PASSWORD']

try:
    client = Garmin(email, password)
    client.login()
    print("Login OK")
except Exception as e:
    print(f"Login failed: {e}", file=sys.stderr)
    sys.exit(1)

end = datetime.today()
start = end - timedelta(days=150)

try:
    activities = client.get_activities_by_date(
        start.strftime('%Y-%m-%d'),
        end.strftime('%Y-%m-%d')
    )
    print(f"Fetched {len(activities)} activities")
except Exception as e:
    print(f"Fetch failed: {e}", file=sys.stderr)
    sys.exit(1)

# Convert to our format
def to_minutes(duration_str):
    if not duration_str:
        return 0
    parts = str(duration_str).split(':')
    try:
        if len(parts) == 3:
            return int(parts[0])*60 + int(parts[1]) + int(parts[2])/60
        elif len(parts) == 2:
            return int(parts[0]) + int(parts[1])/60
        else:
            return float(duration_str) / 60
    except:
        return 0

type_map = {
    'running': 'ラン',
    'treadmill_running': 'トレッドミル',
    'cycling': 'ロードサイクリング',
    'road_biking': 'ロードサイクリング',
    'indoor_cycling': '屋内バイク',
    'virtual_ride': '仮想サイクリング',
    'swimming': 'プールスイム',
    'open_water_swimming': '屋外スイム',
    'lap_swimming': 'プールスイム',
    'walking': 'ウォーク',
    'strength_training': '筋力トレーニング',
    'multi_sport': 'マルチスポーツ',
    'triathlon': 'マルチスポーツ',
}

out = []
for a in activities:
    atype = a.get('activityType', {}).get('typeKey', 'other')
    jp_type = type_map.get(atype, atype)
    
    start_time = a.get('startTimeLocal', '')[:10]
    dist_m = a.get('distance', 0) or 0
    duration_s = a.get('duration', 0) or 0
    avg_hr = a.get('averageHR', None)
    max_hr = a.get('maxHR', None)
    tss = a.get('trainingStressScore', 0) or 0
    np_val = a.get('normPower', None)
    
    out.append({
        'type': jp_type,
        'date': start_time,
        'dist': round(dist_m / 1000, 3),
        'time': round(duration_s / 60, 2),
        'avgHR': int(avg_hr) if avg_hr else None,
        'maxHR': int(max_hr) if max_hr else None,
        'np': int(np_val) if np_val else None,
        'tss': float(tss),
        'p20': None,
        'name': a.get('activityName', '')
    })

with open('activities.json', 'w') as f:
    json.dump(out, f, ensure_ascii=False, indent=2)

print(f"Saved {len(out)} activities to activities.json")
PYTHON

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add activities.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update Garmin activities $(date +%Y-%m-%d)" && git push)
