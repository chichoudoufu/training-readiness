name: Fetch Intervals.icu Data

on:
  schedule:
    - cron: '0 20 * * *'  # 毎日午前5時JST（UTC20時）
  workflow_dispatch:       # 手動実行ボタンも有効

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch activities from Intervals.icu
        run: |
          OLDEST=$(date -d '150 days ago' +%Y-%m-%d 2>/dev/null || date -v-150d +%Y-%m-%d)
          NEWEST=$(date +%Y-%m-%d)
          echo "Fetching $OLDEST to $NEWEST"
          curl -sf \
            -u "API:${{ secrets.ICU_API_KEY }}" \
            "https://intervals.icu/api/v1/athlete/${{ secrets.ICU_ATHLETE_ID }}/activities?oldest=${OLDEST}&newest=${NEWEST}" \
            -o activities.json
          echo "Fetched $(cat activities.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d))' 2>/dev/null || echo '?') activities"

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add activities.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update activities $(date +%Y-%m-%d)" && git push)
