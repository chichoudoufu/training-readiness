name: Fetch Intervals.icu Data

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch activities from Intervals.icu
        run: |
          OLDEST=$(date -d '150 days ago' +%Y-%m-%d)
          NEWEST=$(date +%Y-%m-%d)
          ATHLETE="${{ secrets.ICU_ATHLETE_ID }}"
          KEY="${{ secrets.ICU_API_KEY }}"
          BASE_URL="https://intervals.icu/api/v1/athlete/${ATHLETE}/activities?oldest=${OLDEST}&newest=${NEWEST}"
          
          echo "Fetching ${OLDEST} to ${NEWEST}"
          
          # Format 1: API:key (standard documented format)
          CODE=$(curl -s -o out.json -w "%{http_code}" -u "API:${KEY}" "${BASE_URL}")
          echo "Format 1 (API:key): ${CODE}"
          [ "$CODE" = "200" ] && mv out.json activities.json && echo "Success with format 1" && exit 0
          
          # Format 2: athleteId:key
          CODE=$(curl -s -o out.json -w "%{http_code}" -u "${ATHLETE}:${KEY}" "${BASE_URL}")
          echo "Format 2 (id:key): ${CODE}"
          [ "$CODE" = "200" ] && mv out.json activities.json && echo "Success with format 2" && exit 0
          
          # Format 3: Bearer token
          CODE=$(curl -s -o out.json -w "%{http_code}" -H "Authorization: Bearer ${KEY}" "${BASE_URL}")
          echo "Format 3 (Bearer): ${CODE}"
          [ "$CODE" = "200" ] && mv out.json activities.json && echo "Success with format 3" && exit 0
          
          # Format 4: x-api-key header
          CODE=$(curl -s -o out.json -w "%{http_code}" -H "x-api-key: ${KEY}" "${BASE_URL}")
          echo "Format 4 (x-api-key): ${CODE}"
          [ "$CODE" = "200" ] && mv out.json activities.json && echo "Success with format 4" && exit 0
          
          echo "All formats failed. Last response:"
          cat out.json
          
          # Test without auth to see what error we get
          CODE_NOAUTH=$(curl -s -o noauth.json -w "%{http_code}" "${BASE_URL}")
          echo "No-auth response (${CODE_NOAUTH}):"
          cat noauth.json
          exit 1

      - name: Count and verify
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('activities.json')); print(len(d))" 2>/dev/null || echo "?")
          echo "Fetched ${COUNT} activities"

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add activities.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update activities $(date +%Y-%m-%d)" && git push)
