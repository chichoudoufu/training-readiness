name: Fetch Intervals.icu Data

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch activities from Intervals.icu
        run: |
          OLDEST=$(date -d '150 days ago' +%Y-%m-%d)
          NEWEST=$(date +%Y-%m-%d)
          echo "Fetching $OLDEST to $NEWEST for athlete ${{ secrets.ICU_ATHLETE_ID }}"
          
          # Try auth format 1: API:key
          HTTP_CODE=$(curl -s -o activities.json -w "%{http_code}" \
            -u "API:${{ secrets.ICU_API_KEY }}" \
            "https://intervals.icu/api/v1/athlete/${{ secrets.ICU_ATHLETE_ID }}/activities?oldest=${OLDEST}&newest=${NEWEST}")
          
          echo "HTTP response code: ${HTTP_CODE}"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Auth format 1 failed (${HTTP_CODE}), trying format 2..."
            cat activities.json
            
            # Try auth format 2: athleteId:key
            HTTP_CODE=$(curl -s -o activities.json -w "%{http_code}" \
              -u "${{ secrets.ICU_ATHLETE_ID }}:${{ secrets.ICU_API_KEY }}" \
              "https://intervals.icu/api/v1/athlete/${{ secrets.ICU_ATHLETE_ID }}/activities?oldest=${OLDEST}&newest=${NEWEST}")
            
            echo "Format 2 HTTP code: ${HTTP_CODE}"
          fi
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Both auth formats failed. Response:"
            cat activities.json
            exit 1
          fi
          
          COUNT=$(python3 -c "import json,sys; d=json.load(open('activities.json')); print(len(d))" 2>/dev/null || echo "?")
          echo "Success: ${COUNT} activities fetched"

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add activities.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update activities $(date +%Y-%m-%d)" && git push)
